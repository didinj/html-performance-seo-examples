<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility-First HTML Practices</title>
</head>
<body>
  <header>
    <h1>Web Accessibility Basics</h1>
  </header>
  <main>
    <form>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
      <button type="submit">Subscribe</button>
    </form>
    <img src="team-photo.jpg" alt="Our development team standing in front of the office">
  </main>
  <footer>
    <p>© 2025 Accessible Web</p>
  </footer>
</body>
</html>
